{% extends "admin/base_admin.html" %}

{% block breadcrumbs %}Departments / {{ 'Edit' if department else 'New' }}{% endblock %}

{% block content %}
<div style="max-width:520px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 1rem; padding: 1.5rem;">
    <h2 style="margin-top:0;">{{ 'Edit Department' if department else 'New Department' }}</h2>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Name</label>
            <input type="text" name="name" required value="{{ form.name if form else (department.name if department else '') }}"
                   style="width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:0.5rem; background: var(--bg-body); color: var(--text-main); box-sizing:border-box;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Code</label>
            <input type="text" name="code" required value="{{ form.code if form else (department.code if department else '') }}"
                   style="width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:0.5rem; background: var(--bg-body); color: var(--text-main); box-sizing:border-box; text-transform:uppercase;">
        </div>
        <div style="margin-bottom:1rem;">
            <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Faculty (optional)</label>
            <input type="text" name="faculty" value="{{ form.faculty if form else (department.faculty if department else '') }}"
                   style="width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:0.5rem; background: var(--bg-body); color: var(--text-main); box-sizing:border-box;">
        </div>
        <div style="margin-bottom:1.5rem;">
            <label style="display:block; margin-bottom:0.3rem; font-weight:600;">Department Head (optional)</label>
            <input type="text" name="head_name" value="{{ form.head_name if form else (department.head_name if department else '') }}"
                   style="width:100%; padding:0.6rem; border:1px solid var(--border-color); border-radius:0.5rem; background: var(--bg-body); color: var(--text-main); box-sizing:border-box;">
        </div>
        <button type="submit" style="padding:0.7rem 1.5rem; background: var(--primary); color:white; border:none; border-radius:0.5rem; font-weight:600; cursor:pointer;">Save</button>
        <a href="{{ url_for('admin_departments') }}" style="margin-left:1rem; color: var(--text-muted);">Cancel</a>
    </form>
</div>
{% endblock %}
